<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password | Skinfinity Derma Admin Portal</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.8/dist/sweetalert2.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 10% 20%, rgba(2, 84, 45, 0.08) 0%, rgba(244, 247, 244, 1) 90%);
      padding: 1.5rem;
    }
    .login-card {
      width: 100%;
      max-width: 460px;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 40px rgba(0,0,0,0.06);
      padding: 2.25rem;
    }
    .login-brand {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .login-brand img {
      height: 60px;
      margin-bottom: 0.75rem;
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-brand">
        <img src="assets/img/logo.png" alt="Skinfinity Derma Logo">
        <h4 class="fw-bold mt-2 mb-1" style="color: #02542D;">Set New Password</h4>
        <p class="text-muted small mb-0">Choose a secure password with at least 6 characters.</p>
      </div>

      <form id="resetForm" novalidate>
        <div class="mb-3">
          <label for="resetTokenInput" class="form-label fw-semibold small">Reset Token <span class="text-danger">*</span></label>
          <input type="text" class="form-control font-monospace small" id="resetTokenInput" placeholder="Paste your 64-char token" required>
        </div>

        <div class="mb-3">
          <label for="newPassword" class="form-label fw-semibold small">New Password <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control border-start-0" id="newPassword" placeholder="Minimum 6 characters" required>
          </div>
        </div>

        <div class="mb-4">
          <label for="confirmPassword" class="form-label fw-semibold small">Confirm New Password <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-shield-check"></i></span>
            <input type="password" class="form-control border-start-0" id="confirmPassword" placeholder="Re-type new password" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fs-6 fw-semibold" id="btnSubmit" style="background: #02542D; border-color: #02542D;">
          <span>Update Password & Sign In</span>
          <i class="bi bi-check2-circle ms-2"></i>
        </button>

        <div class="text-center mt-4">
          <a href="login.html" class="text-decoration-none small fw-semibold" style="color: #02542D;">
            <i class="bi bi-arrow-left me-1"></i> Back to Login
          </a>
        </div>
      </form>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.8/dist/sweetalert2.all.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    $(document).ready(function() {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      if (token) {
        $('#resetTokenInput').val(token);
      }

      $('#resetForm').on('submit', function(e) {
        e.preventDefault();
        const tokenVal = $('#resetTokenInput').val().trim();
        const p1 = $('#newPassword').val();
        const p2 = $('#confirmPassword').val();

        if (!tokenVal) {
          Swal.fire('Error', 'Reset token is required', 'warning');
          return;
        }
        if (p1.length < 6) {
          Swal.fire('Error', 'Password must be at least 6 characters', 'warning');
          return;
        }
        if (p1 !== p2) {
          Swal.fire('Error', 'Passwords do not match', 'warning');
          return;
        }

        const $btn = $('#btnSubmit').prop('disabled', true).text('Updating...');

        window.API.post('/auth/reset-password', { token: tokenVal, newPassword: p1 })
          .done(function(res) {
            Swal.fire({
              icon: 'success',
              title: 'Password Updated!',
              text: res.message,
              confirmButtonText: 'Sign In Now',
              confirmButtonColor: '#02542D',
            }).then(() => {
              window.location.href = 'login.html';
            });
          })
          .fail(function(xhr) {
            const msg = xhr.responseJSON ? xhr.responseJSON.message : 'Reset failed. Token may be invalid or expired.';
            Swal.fire('Error', msg, 'error');
          })
          .always(function() {
            $btn.prop('disabled', false).html('<span>Update Password & Sign In</span> <i class="bi bi-check2-circle ms-2"></i>');
          });
      });
    });
  </script>
</body>
</html>
