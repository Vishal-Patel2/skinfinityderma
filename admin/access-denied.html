<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Denied | Skinfinity Derma Admin Portal</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <style>
    .denied-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 10% 20%, rgba(220, 38, 38, 0.05) 0%, rgba(248, 250, 252, 1) 90%);
      padding: 1.5rem;
    }
    .denied-card {
      width: 100%;
      max-width: 520px;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 40px rgba(0,0,0,0.06);
      padding: 2.75rem 2rem;
      text-align: center;
    }
    .shield-icon-wrap {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      background: #fee2e2;
      color: #dc2626;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }
  </style>
</head>
<body>

  <div class="denied-wrapper">
    <div class="denied-card">
      <div class="shield-icon-wrap">
        <i class="bi bi-shield-x"></i>
      </div>
      <h3 class="fw-bold text-dark mb-2">Restricted Access (403)</h3>
      <p class="text-muted small mb-4">
        Your assigned staff role does not have authorization to view or modify this clinical module. Permissions are enforced by the clinic RBAC security policy.
      </p>

      <div class="p-3 bg-light rounded-3 text-start mb-4 border">
        <div class="d-flex justify-content-between small text-muted mb-1">
          <span>Active Staff:</span>
          <strong id="deniedUserName" class="text-dark">Current User</strong>
        </div>
        <div class="d-flex justify-content-between small text-muted">
          <span>Assigned Role:</span>
          <span class="badge bg-secondary" id="deniedUserRole">Staff Role</span>
        </div>
      </div>

      <div class="d-flex gap-2 justify-content-center">
        <a href="index.html" class="btn btn-primary px-4" style="background: #02542D; border-color: #02542D;">
          <i class="bi bi-grid-1x2-fill me-1"></i> Dashboard Overview
        </a>
        <a href="#" class="btn btn-outline-secondary px-3 action-logout">
          <i class="bi bi-box-arrow-right me-1"></i> Sign Out
        </a>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    $(document).ready(function() {
      const u = window.API.getCurrentUser();
      if (u) {
        $('#deniedUserName').text(u.name);
        $('#deniedUserRole').text(u.role || 'Staff');
      }
      $('.action-logout').on('click', function(e) {
        e.preventDefault();
        window.API.logout();
      });
    });
  </script>
</body>
</html>
