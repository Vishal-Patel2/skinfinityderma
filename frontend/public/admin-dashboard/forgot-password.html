<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Skinfinity Derma Admin Portal</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.8/dist/sweetalert2.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 10% 20%, rgba(2, 84, 45, 0.08) 0%, rgba(244, 247, 244, 1) 90%);
      padding: 1.5rem;
    }
    .login-card {
      width: 100%;
      max-width: 460px;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 40px rgba(0,0,0,0.06);
      padding: 2.25rem;
    }
    .login-brand {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .login-brand img {
      height: 60px;
      margin-bottom: 0.75rem;
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-brand">
        <img src="assets/img/logo.png" alt="Skinfinity Derma Logo">
        <h4 class="fw-bold mt-2 mb-1" style="color: #02542D;">Reset Staff Password</h4>
        <p class="text-muted small mb-0">Enter your registered work email to receive reset instructions.</p>
      </div>

      <div id="alertBox" class="alert alert-info d-none" role="alert"></div>

      <form id="forgotForm" novalidate>
        <div class="mb-3">
          <label for="recoveryEmail" class="form-label fw-semibold small">Registered Work Email <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control border-start-0" id="recoveryEmail" placeholder="e.g. admin@skinfinityderma.com" required>
          </div>
          <div class="invalid-feedback">Please enter your registered email address.</div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fs-6 fw-semibold" id="btnSubmit" style="background: #02542D; border-color: #02542D;">
          <span>Send Password Reset Link</span>
          <i class="bi bi-send ms-2"></i>
        </button>

        <div class="text-center mt-4">
          <a href="login.html" class="text-decoration-none small fw-semibold" style="color: #02542D;">
            <i class="bi bi-arrow-left me-1"></i> Return to Sign In
          </a>
        </div>
      </form>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.8/dist/sweetalert2.all.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    $('#forgotForm').on('submit', function(e) {
      e.preventDefault();
      const email = $('#recoveryEmail').val().trim();
      if (!email) {
        $('#recoveryEmail').addClass('is-invalid');
        return;
      }
      $('#recoveryEmail').removeClass('is-invalid');
      const $btn = $('#btnSubmit').prop('disabled', true).text('Generating link...');

      window.API.post('/auth/forgot-password', { email })
        .done(function(res) {
          if (res.resetToken) {
            Swal.fire({
              icon: 'success',
              title: 'Reset Token Generated!',
              html: `<p class="small text-muted mb-3">For clinic testing convenience, your secure reset token has been generated:</p>
                     <div class="p-2 bg-light border rounded text-break font-monospace small mb-3">${res.resetToken}</div>
                     <a href="reset-password.html?token=${res.resetToken}" class="btn btn-sm btn-success">Proceed to Reset Password Page</a>`,
              showConfirmButton: false,
              showCloseButton: true,
            });
          } else {
            Swal.fire('Email Dispatched', res.message, 'success');
          }
        })
        .fail(function(xhr) {
          const msg = xhr.responseJSON ? xhr.responseJSON.message : 'Failed to request reset.';
          Swal.fire('Error', msg, 'error');
        })
        .always(function() {
          $btn.prop('disabled', false).html('<span>Send Password Reset Link</span> <i class="bi bi-send ms-2"></i>');
        });
    });
  </script>
</body>
</html>
