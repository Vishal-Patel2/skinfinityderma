<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Skinfinity Derma Admin Portal</title>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.png">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- SweetAlert2 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.8/dist/sweetalert2.min.css" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 10% 20%, rgba(40, 107, 82, 0.08) 0%, rgba(244, 247, 244, 1) 90%);
      padding: 1.5rem;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 2.25rem;
    }
    .login-brand {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-brand img {
      height: 68px;
      margin-bottom: 0.75rem;
    }
    .login-brand p {
      font-size: 0.86rem;
      color: var(--text-muted);
      margin: 0;
    }
    .demo-credentials-badge {
      background: var(--accent-soft);
      border: 1px dashed var(--secondary);
      border-radius: var(--radius-sm);
      padding: 0.85rem;
      margin-top: 1.5rem;
      font-size: 0.82rem;
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-brand">
        <img src="assets/images/logo.png" alt="Skinfinity Derma Logo">
        <p>Clinic Administration & Content Management Portal</p>
      </div>

      <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="loginEmail" class="form-label">Email Address <span class="required">*</span></label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control border-start-0" id="loginEmail" placeholder="admin@skinfinityderma.com" value="admin@skinfinityderma.com" required>
          </div>
          <div class="invalid-feedback">Please enter a valid clinic email.</div>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="loginPassword" class="form-label mb-0">Password <span class="required">*</span></label>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control border-start-0 border-end-0" id="loginPassword" placeholder="••••••••" value="admin123" required>
            <button class="btn btn-outline-secondary border-start-0 bg-white" type="button" id="togglePasswordBtn">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <div class="invalid-feedback">Please enter your admin password.</div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe" checked>
            <label class="form-check-label text-muted small" for="rememberMe">Remember this browser</label>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fs-6" id="loginSubmitBtn">
          <span>Sign In to Admin Portal</span>
          <i class="bi bi-arrow-right ms-2"></i>
        </button>
      </form>

      <div class="demo-credentials-badge">
        <div class="d-flex align-items-center justify-content-between mb-1">
          <span class="fw-bold text-dark"><i class="bi bi-shield-check me-1 text-success"></i> Default Credentials:</span>
          <button type="button" class="btn btn-sm btn-link p-0 text-decoration-none" id="autofillDemoBtn">Auto-fill</button>
        </div>
        <div class="text-muted">Email: <code>admin@skinfinityderma.com</code></div>
        <div class="text-muted">Password: <code>admin123</code></div>
      </div>
    </div>
  </div>

  <!-- jQuery & Bootstrap Bundle -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.8/dist/sweetalert2.all.min.js"></script>
  <!-- API & Core JS -->
  <script src="assets/js/api.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
